<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Dewey Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="controls">
    <input id="search" placeholder="Enter Dewey code (e.g. 515.2 or 621.4)">
    <button id="btn-search">Search</button>
    <button id="btn-reset" class="reset">Reset</button>
    <button id="btn-add-location" class="add-location">+ Add Location</button>
    <button id="btn-sync" class="reset" style="background: #17a2b8;">Sync</button>
</div>

<div id="list"></div>
<div id="details">Click a location to see all books... (Click items to edit)</div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
</body>
</html>
